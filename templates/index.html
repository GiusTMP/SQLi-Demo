<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Login</h1>
    <form method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br>
        <button type="submit">Login</button>
    </form>

    {% if user %}
        <p id="welcome-message">Welcome, {{ user }}!</p>
    {% endif %}

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <!-- Aggiungi il seguente script per stampare nella console del browser -->
    <script>
        // Se esiste un risultato della query, stampalo nella console del browser
        {% if results.all_users%}
            console.log("Query Result: ", {{ results.all_users | tojson }});
        {% endif %}
    </script>
</body>
</html>
