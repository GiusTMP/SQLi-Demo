<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <!-- Se c'è un errore (es. credenziali errate o tabella non trovata), viene mostrato qui -->
        {% if error %}
        <p class="error-message">{{ error }}</p>
        <script>
            // Visualizza il messaggio di errore nella console
            const errorMessage = {{ consoleError | tojson | safe }};
            console.log("Login Error: ", errorMessage);
        </script>
        {% endif %}
        <!-- Modulo HTML per l'invio delle credenziali di accesso -->
        <form method="POST" action="/">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <button type="submit">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
