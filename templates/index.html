<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <!-- Se c'è un errore (es. credenziali errate), viene mostrato qui -->
        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}
        <!-- Modulo HTML per l'invio delle credenziali di accesso -->
        <form method="POST" action="/">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <button type="submit">Login</button>
            </div>
        </form>
        <!-- Se la query restituisce degli utenti, mostra il messaggio di successo -->
        {% if results.all_users %}
        <h1 class="answer">SUCCESS</h1>
        <p class="answer">You have successfully logged in!!</p>
        <!-- Script per visualizzare i risultati della query nel console log del browser -->
        <script>
            // `results.all_users` è un dizionario che viene convertito in JSON
            const allUsers = {{ results.all_users | tojson | safe }};
            console.log("All Users Query Results: ", allUsers);
        </script>
        {% endif %}
        <!-- Se non ci sono utenti (o se la tabella non esiste), mostra un messaggio specifico -->
        {% if results.no_users %}
            <script>
                // `results.no_users` viene convertito in JSON e passato al console log
                const no_users = {{ results.no_users | tojson | safe }};
                console.log(no_users);
            </script>    
        {% endif %}
    </div>
</body>
</html>
